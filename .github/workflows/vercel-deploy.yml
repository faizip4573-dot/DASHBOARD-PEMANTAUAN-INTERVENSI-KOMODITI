# Bina cache data dashboard dan deploy ke Vercel (produksi).
# Vercel serverless tidak boleh menjalankan penjadual atau menyimpan cache, jadi kerja itu dibuat di sini:
# setiap jam (dan pada setiap push ke main) skrip *:ambil dijalankan, hasilnya disalin ke api/_data, kemudian
# `vercel deploy --prod` memuat naik projek bersama cache itu. Cache tidak pernah di-commit ke git.
#
# GitHub Secrets yang diperlukan (Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   DB_HARGA_URL, DB_HARGA_PUBLISHABLE_KEY
#   PBI_TENANT_ID, PBI_CLIENT_ID, PBI_CLIENT_SECRET, PBI_WORKSPACE_ID, PBI_DATASET_ID
#   MET_API_TOKEN (pilihan; tanpa ini ramalan/amaran MET tidak diambil)
name: Deploy Vercel (data + dashboard)

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *' # setiap jam, minit ke-7 (UTC)
  workflow_dispatch:

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DB_HARGA_URL: ${{ secrets.DB_HARGA_URL }}
      DB_HARGA_PUBLISHABLE_KEY: ${{ secrets.DB_HARGA_PUBLISHABLE_KEY }}
      PBI_TENANT_ID: ${{ secrets.PBI_TENANT_ID }}
      PBI_CLIENT_ID: ${{ secrets.PBI_CLIENT_ID }}
      PBI_CLIENT_SECRET: ${{ secrets.PBI_CLIENT_SECRET }}
      PBI_WORKSPACE_ID: ${{ secrets.PBI_WORKSPACE_ID }}
      PBI_DATASET_ID: ${{ secrets.PBI_DATASET_ID }}
      MET_API_TOKEN: ${{ secrets.MET_API_TOKEN }}
      TZ: Asia/Kuala_Lumpur
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Setiap sumber diambil berasingan: satu kegagalan tidak menghalang deploy (cache sumber lain kekal).
      - name: Harga (DB Harga, Supabase)
        run: npm run harga:ambil
        continue-on-error: true
      - name: Harga Cadangan PSI (AMI + FIS Power BI + SISDA)
        run: npm run psi:ambil
        continue-on-error: true
      - name: Cuaca (MET Malaysia, Open-Meteo)
        run: npm run cuaca:ambil
        continue-on-error: true
      - name: Banjir (JPS)
        run: npm run banjir:ambil
        continue-on-error: true
      - name: Kualiti udara (JAS)
        run: npm run ipu:ambil
        continue-on-error: true
      - name: Berita AI Muse
        run: npm run muse:ambil
        continue-on-error: true
      - name: Siklon (GDACS)
        run: npm run siklon:ambil
        continue-on-error: true
      - name: Amaran rasmi (data.gov.my)
        run: node -e "require('./api/_services/amaran-datagov.js').segar().then(() => console.log('Amaran data.gov.my dikemas kini'))"
        continue-on-error: true
      # Grid cuaca berat (kuota Open-Meteo): hanya setiap 6 jam atau bila dijalankan manual/push
      - name: Grid cuaca (Open-Meteo)
        run: |
          JAM=$(date -u +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ $((10#$JAM % 6)) -eq 0 ]; then npm run grid:ambil; else echo "Langkau grid (jam $JAM UTC)"; fi
        continue-on-error: true

      - name: Salin cache ke api/_data
        run: |
          mkdir -p api/_data
          cp -r data/processed/. api/_data/
          rm -f api/_data/.gitkeep
          echo "Fail cache:"; ls -la api/_data | head -40

      - name: Deploy ke Vercel (produksi)
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
          npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
